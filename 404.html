<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · Página não encontrada | Mateus Henrique</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#050507">
    <link rel="icon" href="https://avatars.githubusercontent.com/u/99336388?v=4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="/css/root.css">
    <link rel="stylesheet" href="/css/404.css">
</head>
<body class="nf">
    <canvas id="bg-canvas" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <header class="container nf-top">
        <a href="/" class="brand" aria-label="Voltar ao início">MH<span>.</span></a>
    </header>

    <main class="nf-main">
        <div class="container">
            <p class="nf-kicker">erro · http 404</p>
            <div class="nf-num" aria-hidden="true">
                <div class="nf-stage" id="nf-stage">
                    <span class="nf-d" data-ch="4"></span>
                    <span class="nf-d" data-ch="0"></span>
                    <span class="nf-d" data-ch="4"></span>
                </div>
            </div>
            <h1 class="nf-title">Página não encontrada</h1>
            <p class="nf-text">O endereço mudou ou nunca existiu. Nenhum dado por aqui.</p>

            <div class="nf-term" role="note">
                <span class="k">SELECT</span> * <span class="k">FROM</span> paginas<br>
                <span class="k">WHERE</span> url = '<span class="u" id="nf-url">/</span>';<br>
                <span class="c">-- 0 linhas retornadas</span><i class="caret" aria-hidden="true"></i>
            </div>

            <div class="nf-actions">
                <a href="/" class="btn btn-primary"><i class="fa-solid fa-arrow-left"></i> Voltar ao início</a>
                <a href="/#projetos" class="btn"><i class="fa-solid fa-chart-column"></i> Ver projetos</a>
            </div>
        </div>
    </main>

    <script src="/js/engine.js"></script>
    <script src="/js/background.js"></script>
    <script src="/js/404.js"></script>
</body>
</html>
